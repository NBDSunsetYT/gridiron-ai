name: Verify actual public GRIDIRON production

# A uniquely named branch selects the already queued PUBLIC research UUID.
# This runner receives no production credentials and never creates private data.
on:
  push:
    branches: ['production-qa/v7-*']

permissions:
  contents: read

concurrency:
  group: gridiron-public-production-verification
  cancel-in-progress: false

jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://gridiron-ai-gray.vercel.app
      QA_SIMULATION_DEADLINE_MS: '1200000'
      # Inspect real saved partial rows without passing the full scanner gate.
      QA_ALLOW_PARTIAL_RESEARCH: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Bind this run to the previously queued public research
        run: |
          node --input-type=module -e '
            import {appendFileSync} from "node:fs";
            const prefix="production-qa/v7-", name=process.env.GITHUB_REF_NAME||"";
            if (!name.startsWith(prefix)) throw new Error("Expected a public production verification branch");
            const id=name.slice(prefix.length);
            if (!/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(id)) throw new Error("Expected the exact queued public research UUID");
            appendFileSync(process.env.GITHUB_ENV, `QA_EXISTING_RUN_ID=${id}\n`);
          '
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify the actual public backend and saved research
        id: research
        continue-on-error: true
        env:
          QA_REPORT_PATH: docs/reports/v7-production-public-workflow.json
        run: node tests/production-v7-public-workflow.mjs
      - name: Verify desktop and iPhone-sized Chromium against production
        if: always()
        env:
          QA_BROWSER: chromium
          QA_REPORT_PATH: docs/reports/v7-production-public-chromium-browser.json
        run: node tests/production-v7-public-browser.mjs
      - name: Verify desktop and iPhone-sized WebKit against production
        if: always()
        env:
          QA_BROWSER: webkit
          QA_REPORT_PATH: docs/reports/v7-production-public-webkit-browser.json
        run: node tests/production-v7-public-browser.mjs
      - name: Retain sanitized public reports in the job log
        if: always()
        run: |
          node --input-type=module -e '
            import {existsSync,readFileSync} from "node:fs";
            for (const file of ["docs/reports/v7-production-public-workflow.json","docs/reports/v7-production-public-chromium-browser.json","docs/reports/v7-production-public-webkit-browser.json"]) {
              if (existsSync(file)) console.log("GRIDIRON_PUBLIC_REPORT "+JSON.stringify({file,report:JSON.parse(readFileSync(file,"utf8"))}));
            }
          '
      - name: Require full-slate scanner acceptance
        if: always()
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const report=JSON.parse(readFileSync("docs/reports/v7-production-public-workflow.json","utf8"));
            if (report.status !== "passed" || report.fullScannerAcceptancePassed !== true) throw new Error("Full scanner acceptance remains blocked. Scoped saved-data browser checks do not convert partial research into a passed full scan.");
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-production-verification
          retention-days: 3
          path: |
            docs/reports/v7-production-public-workflow.json
            docs/reports/v7-production-public-chromium-browser.json
            docs/reports/v7-production-public-webkit-browser.json
            test-results/v7-production-chromium/
            test-results/v7-production-webkit/
